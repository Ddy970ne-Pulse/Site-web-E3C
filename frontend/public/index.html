        <script>
        (function () {
          // Reproduit la logique de ThemeContext.js pour précharger la bonne image
          // hero (jour/nuit) avant même que le bundle React ne s'exécute — sinon le
          // navigateur ne découvre cette image, pourtant la plus visible de la page,
          // qu'après le rendu du composant, ce qui retarde son affichage.
          var saved = localStorage.getItem("e3c-theme");
          var hour = new Date().getHours();
          var isDark = saved !== null ? saved === "dark" : !(hour >= 6 && hour < 18);
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.fetchPriority = "high";
          link.href = isDark ? "/hero-night.jpg" : "/hero-day.jpg";
          document.head.appendChild(link);
        })();
        </script>
